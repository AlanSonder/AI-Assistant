spring:
  application:
    name: ai-assistant
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_assistant
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

ai:
  llm:
    active-provider: ${LLM_ACTIVE_PROVIDER:local}
    default-model: ${LLM_DEFAULT_MODEL:qwen}
    timeout: ${LLM_TIMEOUT:60000}
    max-retries: ${LLM_MAX_RETRIES:3}
    temperature: ${LLM_TEMPERATURE:0.3}
    top-p: ${LLM_TOP_P:0.9}
    max-tokens: ${LLM_MAX_TOKENS:4096}
    providers:
      local:
        base-url: ${LLM_LOCAL_URL:http://localhost:1234/v1}
        api-key: ${LLM_LOCAL_KEY:sk-lm-local}
        models:
          - qwen
          - llama
      deepseek:
        base-url: ${LLM_DEEPSEEK_URL:https://api.deepseek.com}
        api-key: ${LLM_DEEPSEEK_KEY:sk-2ce14ae2234947709419a377083cb91b}
        models:
          - deepseek-v4-pro
          - deepseek-v4-flash
        vision-enabled: false
        thinking:
          enabled: ${LLM_DEEPSEEK_THINKING:false}
        reasoning-effort: ${LLM_DEEPSEEK_REASONING:high}

  translator:
    max-text-length: 50000
    max-segment-length: 3000
    enable-cache: true
    cache-size: 10000
    cache-ttl-minutes: 1440
    default-domain: general
    default-style: neutral

server:
  port: 9090

